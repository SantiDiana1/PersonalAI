name: personalai-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personalai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personalai}
      POSTGRES_DB: ${POSTGRES_DB:-personalai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - personalai-postgres-data:/var/lib/postgresql/data
      - ./scripts/dev/init-pgvector.sql:/docker-entrypoint-initdb.d/00-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personalai} -d ${POSTGRES_DB:-personalai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personalai-postgres-data:
