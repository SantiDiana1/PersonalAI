User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Solo lo alcanzan los contenedores de la red interna de claude-code-runner-mcp.
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 192.168.0.0/16

# Allowlist estricta — ver docs/hermes/spec.md §3.4. Cualquier host que no
# coincida con filter.allow se rechaza (FilterDefaultDeny Yes).
Filter "/etc/tinyproxy/filter.allow"
FilterDefaultDeny Yes
# FilterExtended (regex sobre el host) está deprecado a favor de FilterType
# en versiones más nuevas de tinyproxy, pero la sintaxis "FilterType fqdn"
# no la acepta la versión empaquetada en Alpine 3.20 — se mantiene
# FilterExtended, que sí funciona (solo emite un warning al arrancar).
FilterExtended Yes

DisableViaHeader Yes
