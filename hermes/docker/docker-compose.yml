# Despliegue de PersonalAI en el servidor local (Mac Mini).
#
# Uso, desde este directorio:
#   cp .env.example .env    # y rellenar los secretos
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# ---------------------------------------------------------------------------
# LA DECISIÓN DE DISEÑO MÁS IMPORTANTE DE ESTE FICHERO
# ---------------------------------------------------------------------------
# `claude-code-runner` es el ÚNICO servicio que monta /var/run/docker.sock.
# `hermes` NO lo monta, y no debe montarlo nunca (SEC-2.1 de docs/security.md).
#
# En Docker, poder hablar con el socket equivale a control total del host: se
# puede crear un contenedor que monte el disco entero. hermes-agent es
# precisamente el componente que ingiere texto no confiable (cuerpos de issues
# de GitHub, mensajes de Telegram), así que darle esa capacidad convertiría
# cualquier prompt injection en compromiso del Mac Mini.
#
# Por eso el runner se registra en hermes por HTTP (`hermes mcp add --url`) y
# no por stdio: un servidor MCP stdio corre como subproceso de su cliente, lo
# que lo metería dentro del contenedor de hermes y forzaría exactamente lo que
# este diseño evita. Ver docs/hermes/spec.md §3.5.
# ---------------------------------------------------------------------------

name: personalai

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personalai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-personalai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Sin `ports:` — solo accesible desde la red interna del compose.
    networks: [personalai]
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-personalai} -d ${POSTGRES_DB:-personalai}']
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # IMPORTANTE, hallazgo real (Fase 8): `claude-code-runner-image:local` — la
  # imagen del CONTENEDOR EFÍMERO POR TAREA (la que ejecuta
  # apps/claude-code-runner-mcp/docker/runner/entrypoint.sh dentro de cada
  # run_coding_task/run_claude_command) — NO es un servicio de este compose y
  # `docker compose build`/`up --build` NUNCA la reconstruye. Es una imagen
  # aparte, lanzada por `runContainer.ts` vía `docker.createContainer`, no
  # por Compose. Verificado en producción: tras cambiar entrypoint.sh para
  # la Fase 8, `docker compose up -d --build claude-code-runner` reconstruyó
  # SOLO el servidor MCP de abajo, dejando la imagen de tarea 4 días
  # desactualizada — cualquier llamada real a run_claude_command fallaba en
  # silencio ("contenedor terminó sin escribir command-result.json").
  # Reconstrúyela A MANO cada vez que cambie
  # apps/claude-code-runner-mcp/docker/runner/{Dockerfile,entrypoint.sh}:
  #
  #   docker build -t claude-code-runner-image:local \
  #     -f apps/claude-code-runner-mcp/docker/runner/Dockerfile \
  #     apps/claude-code-runner-mcp/docker/runner
  # -------------------------------------------------------------------------
  claude-code-runner:
    build:
      # Contexto = raíz del monorepo: el paquete depende de @personalai/shared
      # vía `workspace:*`.
      context: ../..
      dockerfile: apps/claude-code-runner-mcp/Dockerfile
    image: claude-code-runner-mcp:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # SEC-3.1: NINGÚN `ports:`. El endpoint MCP vive solo en la red interna del
    # compose; no es alcanzable desde el host ni desde otros equipos de la LAN.
    # Añadir `ports:` aquí publicaría en internet doméstico un endpoint capaz de
    # ejecutar código. No se hace ni "temporalmente para depurar".
    networks: [personalai]
    volumes:
      # SEC-4.1: el socket de Docker, SOLO aquí. Es la razón de ser de este
      # servicio (lanzar los contenedores efímeros por tarea).
      - /var/run/docker.sock:/var/run/docker.sock
      # SEC-4.4 + docs/hermes/spec.md §3.6: la raíz de workspaces se monta en la
      # MISMA ruta dentro del contenedor que en el host. Es obligatorio: los
      # bind mounts que este servicio pide para los contenedores efímeros los
      # resuelve el demonio de Docker EN EL HOST. Si las rutas no coinciden, el
      # contenedor efímero recibe un /workspace vacío y la tarea falla de forma
      # confusa, sin error claro.
      - ${WORKSPACE_ROOT:-/var/lib/personalai/workspaces}:${WORKSPACE_ROOT:-/var/lib/personalai/workspaces}
      # Fase 8 (US-8.2): directorio persistente para los HTML que genera
      # run_claude_command, en la MISMA ruta que en el servicio `hermes` de
      # abajo — así el `htmlFilePath` que devuelve esta tool es directamente
      # la ruta que hermes-agent necesita para el tag MEDIA: del gateway de
      # Telegram (docs/hermes/spec.md §3.7), sin traducción de rutas entre
      # contenedores. Igual de lectura/escritura que WORKSPACE_ROOT, pero
      # NUNCA se limpia solo — ver el comentario de retención en
      # apps/claude-code-runner-mcp/src/runClaudeCommand.ts::persistArtifact.
      - ${ARTIFACTS_ROOT:-/var/lib/personalai/artifacts}:${ARTIFACTS_ROOT:-/var/lib/personalai/artifacts}
    environment:
      CLAUDE_CODE_RUNNER_TRANSPORT: http
      CLAUDE_CODE_RUNNER_HTTP_PORT: '8080'
      CLAUDE_CODE_RUNNER_WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/var/lib/personalai/workspaces}
      CLAUDE_CODE_RUNNER_ARTIFACTS_DIR: ${ARTIFACTS_ROOT:-/var/lib/personalai/artifacts}
      # SEC-3.2: sin este secreto el proceso no arranca. Genéralo con
      # `openssl rand -hex 32`; debe ser distinto de cualquier otro secreto.
      CLAUDE_CODE_RUNNER_AUTH_TOKEN: ${CLAUDE_CODE_RUNNER_AUTH_TOKEN:?falta CLAUDE_CODE_RUNNER_AUTH_TOKEN}
      # Sesión Pro compartida (docs/hermes/spec.md §0.1/§0.3).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?falta CLAUDE_CODE_OAUTH_TOKEN}
      # SEC-6.1: PAT fine-grained, scoped solo a los repos donde Hermes actúa.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN}
      DATABASE_URL: postgres://${POSTGRES_USER:-personalai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-personalai}
      CLAUDE_CODE_RUNNER_MAX_CONCURRENT: ${CLAUDE_CODE_RUNNER_MAX_CONCURRENT:-2}
      CLAUDE_CODE_RUNNER_MAX_PER_HOUR: ${CLAUDE_CODE_RUNNER_MAX_PER_HOUR:-10}

  brain:
    build:
      context: ../..
      dockerfile: apps/brain/Dockerfile
    image: brain:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Igual que claude-code-runner: sin `ports:`, solo red interna de Compose.
    # Ningún privilegio especial (no toca Docker) — se mantiene sin publicar
    # de todos modos, por consistencia y porque no hace falta.
    networks: [personalai]
    environment:
      BRAIN_HTTP_PORT: '8090'
      # Autoridad propia (SEC-6.4: "un secreto, un propósito"), distinta de
      # CLAUDE_CODE_RUNNER_AUTH_TOKEN — solo la llama brain-mcp.
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN:?falta BRAIN_API_TOKEN}
      # Esquema propio (`brain`) en el MISMO Postgres que usa el runner
      # (esquema `runner`) — evita levantar una segunda base de datos para un
      # proyecto personal. Ver docs/personal-brain/spec.md §6.
      DATABASE_URL: postgres://${POSTGRES_USER:-personalai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-personalai}
      # Proveedor de embeddings (docs/personal-brain/spec.md §11): Hugging
      # Face Inference API, BAAI/bge-m3 por defecto.
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:?falta HUGGINGFACE_API_KEY}

  brain-mcp:
    build:
      context: ../..
      dockerfile: apps/brain-mcp/Dockerfile
    image: brain-mcp:local
    restart: unless-stopped
    depends_on:
      brain:
        condition: service_healthy
    # Mismo patrón que claude-code-runner (SEC-3.1 aplicado por consistencia,
    # aunque este servicio no tenga privilegios especiales): sin `ports:`.
    networks: [personalai]
    environment:
      BRAIN_MCP_TRANSPORT: http
      BRAIN_MCP_HTTP_PORT: '8091'
      # Autoridad del canal hermes -> brain-mcp. Genéralo con
      # `openssl rand -hex 32`; distinto de BRAIN_API_TOKEN y de
      # CLAUDE_CODE_RUNNER_AUTH_TOKEN (SEC-6.4).
      BRAIN_MCP_AUTH_TOKEN: ${BRAIN_MCP_AUTH_TOKEN:?falta BRAIN_MCP_AUTH_TOKEN}
      BRAIN_URL: http://brain:8090
      # Canal brain-mcp -> brain: MISMO valor que BRAIN_API_TOKEN de arriba.
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN:?falta BRAIN_API_TOKEN}

  # -------------------------------------------------------------------------
  # Modelo local (Fase 13). Primer eslabón de la cadena de proveedores del
  # agent loop de Hermes — ver hermes/config/hermes.config.yaml.
  #
  # DETRÁS DE UN PROFILE a propósito: `docker compose up -d` NO lo arranca.
  # Solo se levanta con `--profile local-llm`, porque un modelo local necesita
  # varios GB de RAM y en una máquina que no los tenga el contenedor moriría
  # por OOM arrastrando la percepción de que "el compose está roto".
  #
  # Dimensionado para el destino real (Mac Mini, 16 GB). Medido en el portátil
  # donde se desarrolló esto: 7,8 GB totales y ~1,9 libres — ahí NO cabe, y por
  # eso el profile no es una precaución teórica.
  #
  # Sin `ports:` (SEC-3.1): solo alcanzable desde la red interna. Publicarlo
  # expondría un endpoint de inferencia sin autenticación — Ollama no trae
  # ninguna.
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    restart: unless-stopped
    networks: [personalai]
    volumes:
      # Los modelos pesan GB: sin volumen se re-descargan en cada recreate.
      - ollama-models:/root/.ollama
    environment:
      # Descarga el modelo tras 5 min sin uso y libera la RAM. En una máquina
      # compartida con Postgres, Brain y el runner, mantenerlo residente sería
      # quitarle memoria al resto todo el día.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8g}
    healthcheck:
      # /api/tags es el endpoint más barato que confirma que el servidor
      # responde; no carga ningún modelo.
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # -------------------------------------------------------------------------
  # Bot de control (US-9.2). SEGUNDO bot de Telegram, con su propio token:
  # Telegram solo admite UN consumidor de updates por token, así que no puede
  # compartir el de `hermes` — los dos harían getUpdates y se robarían los
  # mensajes entre sí (error 409 de la Bot API).
  #
  # Su razón de ser es el determinismo: responde /metricas calculando sobre la
  # base de datos, sin modelo de por medio, así que no gasta cuota de Claude
  # Pro y no depende de que un agente decida llamar a la tool correcta.
  #
  # Deliberadamente el servicio MENOS privilegiado del compose: sin socket de
  # Docker, sin CLAUDE_CODE_RUNNER_AUTH_TOKEN (ese token autentica también
  # /mcp, que lanza contenedores), sin `ports:`, y sin acceso a los workspaces
  # ni a los artefactos. Solo SELECTs contra Postgres y salida a
  # api.telegram.org.
  control-bot:
    build:
      context: ../..
      dockerfile: apps/control-bot/Dockerfile
    image: control-bot:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [personalai]
    environment:
      # SEC-1.3: token del SEGUNDO bot, creado aparte en BotFather. Nunca el
      # mismo valor que TELEGRAM_BOT_TOKEN.
      CONTROL_BOT_TELEGRAM_TOKEN: ${CONTROL_BOT_TELEGRAM_TOKEN:?falta CONTROL_BOT_TELEGRAM_TOKEN}
      # SEC-1.1: allowlist obligatoria. El bot no arranca sin ella — su chat es
      # alcanzable por cualquiera que descubra el nombre del bot.
      CONTROL_BOT_ALLOWED_USERS: ${CONTROL_BOT_ALLOWED_USERS:?falta CONTROL_BOT_ALLOWED_USERS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-personalai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}@postgres:5432/${POSTGRES_DB:-personalai}
      # Fase 13 (US-13.5): eslabones de la cadena de proveedores que el bot
      # sondea para `/proveedores`. Formato: nombre|tipo|url, separados por
      # comas. Tipos: `ollama` (lista además los modelos descargados) y `http`
      # (solo alcanzabilidad).
      #
      # OJO, limitación honesta: esto declara los eslabones que se ESPERAN, no
      # lee la cadena real de hermes (que vive en su config.yaml, dentro de un
      # volumen con un token de por medio que este bot no debe montar). Si se
      # cambia la cadena con `hermes fallback`, hay que actualizar esto también
      # — el comando lo advierte en su propia salida.
      #
      # Actualizado el 2026-08-26: la cadena pasó a `anthropic` (primario) →
      # OpenRouter (respaldo gratuito). Se retira la sonda de `ollama`: con el
      # modelo local en futurible, aparecería como CAÍDO en cada consulta y un
      # aviso permanente que siempre es falso enseña a ignorar los avisos.
      # Si se retoma el profile `local-llm`, hay que volver a añadirla.
      CONTROL_BOT_PROVIDER_PROBES: ${CONTROL_BOT_PROVIDER_PROBES:-anthropic|http|https://api.anthropic.com/v1/models,openrouter|http|https://openrouter.ai/api/v1/models}
      # Estado de los cronjobs para `/cron`. Solo lectura; ver el mount y el
      # `user:` de abajo, que es donde está el matiz.
      CONTROL_BOT_CRON_JOBS_PATH: /hermes-cron/jobs.json
      # Fase 15 (US-15.2). Eslabones a los que /modelo puede cambiar —
      # alias|provider|model separados por comas, DECLARADOS igual que
      # CONTROL_BOT_PROVIDER_PROBES, nunca leídos de la cadena viva de hermes
      # (mismo motivo de SEC-1.5). Si se cambia `fallback_providers` con
      # `hermes fallback`, hay que actualizar esto también.
      CONTROL_BOT_MODEL_CHOICES: ${CONTROL_BOT_MODEL_CHOICES:-anthropic|anthropic|claude-sonnet-4-5-20250929,minimax|openrouter|minimax/minimax-m3:free,nemotron|openrouter|nvidia/nemotron-3.5-lightning:free}
      # Nombre real del contenedor de hermes-agent en este despliegue —
      # verificado con `docker ps` (prefijo del nombre del proyecto Compose).
      CONTROL_BOT_HERMES_CONTAINER_NAME: ${CONTROL_BOT_HERMES_CONTAINER_NAME:-personalai-hermes-1}
    volumes:
      # SOLO el subdirectorio `cron` de $HERMES_HOME, y en solo lectura. NO se
      # monta $HERMES_HOME entero: ahí vive `auth.json` con el token OAuth de
      # Claude, y este es el proceso que ingiere texto de Telegram (SEC-1.5).
      - ${HERMES_HOME:-~/.hermes}/cron:/hermes-cron:ro
      # Fase 15 (US-15.2, docs/security.md SEC-1.6). Ampliación de privilegio
      # real y deliberada: /modelo necesita ejecutar `hermes config set` y
      # reiniciar el contenedor de Hermes, y no hay forma de hacer eso sin
      # hablar con el demonio de Docker. Lo que lo mantiene acotado es
      # apps/control-bot/src/docker.ts, no este mount — léelo antes de tocar
      # esta línea.
      - /var/run/docker.sock:/var/run/docker.sock
    # SIN `user:` desde la Fase 15 (antes: '10000:10000', el mismo uid que
    # hermes-agent, para poder leer `cron/jobs.json` a modo 0600). Ese truco ya
    # no hace falta: el contenedor corre como root por el socket de Docker
    # (ver el Dockerfile), y root lee cualquier fichero alcanzable sin
    # necesidad de compartir uid. La superficie de "qué queda alcanzable" no
    # cambia — sigue siendo solo `cron/` en `:ro` más el socket acotado en
    # código — pero ya no depende de hacer coincidir un uid a mano.
    # Ver docs/security.md SEC-1.5 y SEC-1.6.

  hermes:
    build:
      # Checkout de NousResearch/hermes-agent. No modificamos su código: se
      # construye tal cual desde el upstream (docs/hermes/spec.md §2).
      context: ${HERMES_AGENT_PATH:?falta HERMES_AGENT_PATH (ruta al checkout de hermes-agent)}
    image: hermes-agent:local
    restart: unless-stopped
    depends_on:
      claude-code-runner:
        condition: service_healthy
      brain-mcp:
        condition: service_healthy
    # SEC-2.2: sin `network_mode: host` (el compose upstream lo usa por
    # comodidad). Con red de Compose, hermes no ve la red doméstica ni los
    # servicios del Mac Mini — solo lo que necesita: salida a internet y el
    # runner por nombre de servicio.
    networks: [personalai]
    volumes:
      # SEC-2.1: aquí NO se monta /var/run/docker.sock. Nunca.
      - ${HERMES_HOME:-~/.hermes}:/opt/data
      # Los skills resolve-issue y run-task se cargan desde el repo (fuente de
      # verdad versionada) vía `skills.external_dirs`, en vez de copiarlos a
      # ~/.hermes/skills/ y tener copias divergiendo. Solo lectura. Al montar
      # el directorio padre, un skill nuevo bajo hermes/skills/ no necesita
      # ningún cambio aquí para que hermes lo vea.
      #
      # Deliberadamente FUERA de $HERMES_HOME (/opt/data), no debajo de él
      # (US-6.2 de docs/decisions-log.md): el entrypoint de hermes-agent hace
      # `chown -R hermes:hermes $HERMES_HOME` en cada arranque, y como este
      # mount es `:ro`, ese chown fallaba en él ("Read-only file system"),
      # produciendo el warning "chown failed (rootless container?)" en cada
      # arranque — engañoso, porque no tiene nada que ver con Podman rootless,
      # es simplemente este sub-mount de solo lectura. Montándolo fuera de
      # $HERMES_HOME el chown recursivo no lo toca y el warning desaparece.
      - ../skills:/opt/skills-repo:ro
      # Fase 8 (US-8.2): MISMA ruta que en `claude-code-runner` de arriba —
      # el gateway de Telegram de hermes-agent lee el fichero directamente
      # de aquí cuando un Skill responde con el tag `MEDIA:<ruta>`. Solo
      # lectura: hermes nunca escribe aquí, solo el runner.
      - ${ARTIFACTS_ROOT:-/var/lib/personalai/artifacts}:${ARTIFACTS_ROOT:-/var/lib/personalai/artifacts}:ro
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      # Misma sesión Pro que el runner, un único secreto compartido.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?falta CLAUDE_CODE_OAUTH_TOKEN}
      # SEC-1.3: secreto de primer nivel — quien lo tenga puede leer todo lo
      # que se le escribe al bot y suplantarlo. Sin esta variable, el
      # adaptador de Telegram del gateway ni siquiera se activa
      # (gateway/config.py::_apply_env_overrides solo activa Platform.TELEGRAM
      # si TELEGRAM_BOT_TOKEN no está vacío).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # SEC-1.1/SEC-1.2: allowlist explícita para el gateway. Los flags
      # GATEWAY_ALLOW_ALL_USERS / TELEGRAM_ALLOW_ALL_USERS no se ponen jamás.
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
    command: ['gateway', 'run']

# El dashboard de hermes-agent almacena credenciales de proveedores. Si lo
# quieres, añádelo atado a 127.0.0.1 y accede por túnel SSH — nunca con
# `--host 0.0.0.0` (SEC-0.3 de docs/security.md).

networks:
  personalai:
    driver: bridge

volumes:
  postgres-data:
  ollama-models:
