# Configuración de hermes-agent para PersonalAI.
#
# ESTE FICHERO NO SE COPIA ENCIMA DE ~/.hermes/config.yaml.
#
# El config.yaml real de hermes-agent lo genera y mantiene el propio hermes
# (tiene ~340 líneas de opciones con sus defaults). Sobrescribirlo entero
# rompería cosas y se desactualizaría en cada versión. Lo que hay aquí son
# EXCLUSIVAMENTE las claves que este proyecto necesita fijar, con el valor que
# deben tener y por qué.
#
# Cómo aplicarlo: ver hermes/config/README.md.

# ---------------------------------------------------------------------------
# Servidores MCP
# ---------------------------------------------------------------------------
mcp_servers:
  # Nuestro runner. Se registra por URL (HTTP), NO por `command` (stdio).
  #
  # Esto es deliberado y es el eje de la arquitectura: un servidor MCP stdio
  # corre como subproceso de su cliente, así que registrarlo con `command`
  # metería el runner —el único proceso con acceso al socket de Docker— dentro
  # del contenedor de hermes, que es el que ingiere texto no confiable.
  # Ver docs/security.md SEC-2.1 y docs/hermes/spec.md §3.5.
  #
  # `claude-code-runner` es el nombre del servicio en docker-compose.yml; se
  # resuelve por DNS interno de Compose. El puerto no está publicado (SEC-3.1).
  claude-code-runner:
    url: http://claude-code-runner:8080/mcp
    # SEC-3.2. El valor real vive en ~/.hermes/.env como
    # MCP_CLAUDE_CODE_RUNNER_API_KEY y debe coincidir con la variable
    # CLAUDE_CODE_RUNNER_AUTH_TOKEN del compose.
    headers:
      Authorization: Bearer ${MCP_CLAUDE_CODE_RUNNER_API_KEY}
    # Debe ser MAYOR que el timeoutSeconds por defecto de run_coding_task
    # (1800s, ver apps/claude-code-runner-mcp/src/runCodingTask.ts). Sin este
    # campo, el timeout por defecto del cliente MCP de hermes es mucho más
    # corto: hermes se rinde y reporta `timed_out` al Operador mientras la
    # tarea real sigue corriendo en segundo plano y puede acabar en éxito —
    # discrepancia real, reproducida en Fase 2 (issue de prueba #6): el
    # runner pusheó una rama con un commit válido después de que hermes ya
    # hubiera comentado "timed_out" y cerrado el ciclo, dejando la rama sin PR.
    timeout: 1900

  # Nuestro adaptador de memoria (Fase 5). Igual que claude-code-runner: por
  # URL/HTTP, no por `command` — brain-mcp no tiene ningún privilegio especial
  # (no toca Docker), pero se mantiene el mismo patrón por consistencia y para
  # no acoplar código propio como subproceso del contenedor de hermes.
  #
  # `brain-mcp` es el nombre del servicio en docker-compose.yml.
  brain-mcp:
    url: http://brain-mcp:8091/mcp
    # El valor real vive en ~/.hermes/.env como MCP_BRAIN_MCP_API_KEY y debe
    # coincidir con BRAIN_MCP_AUTH_TOKEN del compose.
    headers:
      Authorization: Bearer ${MCP_BRAIN_MCP_API_KEY}
    # Corto a propósito (US-5.2 de docs/roadmap.md): si Brain no responde, la
    # tarea debe poder seguir sin contexto en vez de bloquearse. Debe ser
    # MAYOR que el timeout interno de brainClient.ts (BRAIN_REQUEST_TIMEOUT_MS,
    # 25s por defecto — subido desde 10s tras verificar en vivo que un "cold
    # start" real de la Hugging Face Inference API puede tardar más de eso),
    # o hermes cortaría la llamada antes de que brain-mcp complete su propio
    # timeout.
    timeout: 30

  # GitHub. Servidor de terceros ya existente — no escribimos conector propio.
  #
  # Se usa la implementación stdio en TypeScript, ejecutada con npx dentro del
  # contenedor de hermes (su imagen ya trae nodejs y npm). Motivo: el servidor
  # oficial en Go se distribuye principalmente como imagen Docker, y lanzarlo
  # desde dentro de hermes exigiría darle el socket de Docker — justo lo que
  # esta arquitectura prohíbe (SEC-2.1).
  #
  # Nota honesta: este paquete está archivado upstream. Funciona, pero si deja
  # de mantenerse, la alternativa sin socket es el servidor remoto de GitHub
  # (`url: https://api.githubcopilot.com/mcp/` con la misma cabecera Bearer),
  # que traslada la ejecución a GitHub en vez de a un proceso local.
  github:
    command: npx
    args: ['-y', '@modelcontextprotocol/server-github']
    env:
      # SEC-6.1: PAT fine-grained, scoped SOLO a los repos donde Hermes actúa,
      # con permisos mínimos (contenidos, issues, pull requests).
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}

  # Notion (Fase 7, US-7.2 de docs/roadmap.md) — servidor MCP oficial de
  # Notion, pensado para la base de datos "Hermes Tasks" (propiedad
  # `status = Ready for Hermes`), fuente personal del Operador.
  #
  # ACTIVADO (registrado en ~/.hermes/config.yaml con el token real del
  # Operador). `hermes mcp test notion` conecta y descubre 24 tools —
  # verificado también con una llamada real a `POST /v1/search` (200 OK,
  # token válido). Pendiente de un único paso manual del Operador: compartir
  # la base de datos "Hermes Tasks" con esta integración desde la propia UI
  # de Notion ("..." → Connections) — sin eso, `results` viene vacío aunque
  # el token sea correcto. Ver `hermes/skills/resolve-issue/SKILL.md` §
  # "Generalización a Notion y Jira (Fase 7)" → "Estado real".
  notion:
    command: npx
    args: ['-y', '@notionhq/notion-mcp-server']
    env:
      # El valor real vive en ~/.hermes/.env como NOTION_TOKEN (integración
      # interna creada por el Operador en notion.so/my-integrations).
      NOTION_TOKEN: ${NOTION_TOKEN}

  # Jira (Fase 7, US-7.1 de docs/roadmap.md) — servidor MCP de comunidad
  # (@aashari/mcp-server-atlassian-jira, stdio vía npx), JQL fijo
  # `labels = hermes AND status = "To Do"`, sobre proyectos personales del
  # Operador (nunca proyectos de empresa — esos esperan a Azure DevOps + la
  # instancia de trabajo separada de la Fase 10).
  #
  # ACTIVADO (registrado en ~/.hermes/config.yaml con el token real del
  # Operador). `hermes mcp test jira` conecta y descubre 5 tools
  # (jira_get/post/put/patch/delete) — verificado también con una llamada
  # real a la JQL del párrafo anterior (200 OK, 0 resultados porque aún no
  # hay ningún issue con esa etiqueta+estado, no por fallo de auth). Elegido
  # este paquete concreto (frente al remoto oficial de Atlassian, que exige
  # OAuth) porque el Operador ya tenía un API token clásico, sin
  # infraestructura OAuth adicional que montar.
  jira:
    command: npx
    args: ['-y', '@aashari/mcp-server-atlassian-jira']
    env:
      # Subdominio de https://<site>.atlassian.net — no es secreto, pero
      # vive en .env igual que el resto por consistencia con el patrón de
      # este fichero (nada específico del Operador se commitea al repo).
      ATLASSIAN_SITE_NAME: ${ATLASSIAN_SITE_NAME}
      ATLASSIAN_USER_EMAIL: ${ATLASSIAN_USER_EMAIL}
      # El valor real vive en ~/.hermes/.env como ATLASSIAN_TOKEN
      # (id.atlassian.com/manage-profile/security/api-tokens).
      ATLASSIAN_API_TOKEN: ${ATLASSIAN_TOKEN}

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
skills:
  # Carga el skill resolve-issue directamente desde el repositorio, en vez de
  # copiarlo a ~/.hermes/skills/. Así la fuente de verdad es el repo (versionada
  # y revisable) y no hay dos copias divergiendo.
  #
  # La ruta debe ser la que ve el CONTENEDOR de hermes. Si montas el repo,
  # ajústala; si prefieres no montarlo, copia hermes/skills/resolve-issue a
  # ~/.hermes/skills/ y deja esta lista vacía.
  # Fuera de /opt/data ($HERMES_HOME) a propósito — ver el comentario del
  # mount en hermes/docker/docker-compose.yml (US-6.2 de docs/roadmap.md).
  external_dirs:
    - /opt/skills-repo

# ---------------------------------------------------------------------------
# Aprobaciones — SEC-2.3
# ---------------------------------------------------------------------------
# Ambos son ya el valor por defecto de hermes-agent; se declaran aquí porque
# son un requisito de seguridad, no una preferencia, y deben sobrevivir a
# cualquier revisión futura de la configuración.
approvals:
  # Los comandos peligrosos de shell piden confirmación al Operador.
  mode: manual
  # En cron no hay nadie para aprobar, así que se BLOQUEAN. El skill
  # resolve-issue está escrito para trabajar solo con tools MCP precisamente
  # para no necesitar que esto se relaje a `approve`.
  cron_mode: deny

# ---------------------------------------------------------------------------
# Modelo y cadena de proveedores (Fase 13)
# ---------------------------------------------------------------------------
# HISTORIA, porque explica por qué esto es una CADENA y no un proveedor único:
#
# Hasta la Fase 12 aquí ponía `provider: anthropic` a secas, autenticado con la
# sesión Pro compartida vía CLAUDE_CODE_OAUTH_TOKEN. Eso dejó de funcionar el
# 2026-08-26: Anthropic clasifica a hermes-agent como *third-party app* y
# rechaza su consumo del plan Pro con
#
#   HTTP 400 — "Third-party apps now draw from your extra usage, not your
#              plan limits."
#
# No es cuota agotada, es política. El runner NO está afectado (ejecuta el
# binario oficial `claude -p`, que Anthropic sí acepta) — ver docs/roadmap.md
# Fase 12 US-12.3.
#
# La lección no es "cambiar de proveedor", que sería repetir el mismo error con
# otro nombre: es no tener un único punto de fallo de proveedor. De ahí la
# cadena.
#
# `fallback_providers` es un mecanismo nativo de hermes-agent (top-level en
# config.yaml, gestionado con `hermes fallback` — hermes_cli/fallback_cmd.py).
# No hay que construir nada, solo configurarlo.
#
# ORDEN DECIDIDO, de barato a caro:
#
#   1. ollama    — modelo local. Coste por turno: cero. Sin cuota, sin red.
#                  Es el eslabón por defecto porque el loop de hermes sobre
#                  todo ORQUESTA (decide qué tool llamar y formatea la
#                  respuesta); el trabajo caro de verdad lo hace Claude Code
#                  dentro del runner, que sigue en la suscripción Pro.
#   2. <barato>  — proveedor comercial pequeño, PENDIENTE de elegir con precios
#                  reales (US-13.4). Cubre el caso de que el modelo local no dé
#                  la talla en una petición concreta.
#   3. anthropic — último recurso consciente, contra usage credits y con tope
#                  de gasto mensual. Calidad de Claude cuando de verdad hace
#                  falta, pagando por ello a sabiendas.
#
# NO se aplica copiando este fichero (ver cabecera). Se aplica con:
#   hermes config set model.provider ollama
#   hermes fallback add anthropic
#
# ADVERTENCIA vigente: si defines ANTHROPIC_API_KEY en el .env, hermes-agent la
# tomará en lugar de cualquier otra ruta de Anthropic. Sigue sin haber ninguna.
model:
  provider: ollama

# El eslabón intermedio se añadirá aquí cuando US-13.4 lo haya elegido con
# precios verificados. Mientras tanto, la cadena tiene dos eslabones reales.
fallback_providers:
  - anthropic
